on: [push, pull_request]

name: future_tests

jobs:
  future_tests:
    if: "! contains(github.event.head_commit.message, '[ci skip]')"

    timeout-minutes: 30

    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} future.plan=${{ matrix.future.plan }}

    strategy:
      fail-fast: false
      matrix:
        ## 'mizu' communicates via shared memory, which is implemented
        ## differently on each operating system
        os: [ubuntu-latest, macOS-latest, windows-latest]
        future:
          - { plan: 'future.mizu::mizu_multisession' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      ## R CMD check
      _R_CHECK_MATRIX_DATA_: true
      _R_CHECK_CRAN_INCOMING_: false
      ## Specific to futures
      R_FUTURE_RNG_ONMISUSE: error

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
            any::sessioninfo
          needs: check

      - name: Install package itself (special case)
        run: |
          install.packages(".", repos = NULL, type = "source")  ## needed by parallel workers
        shell: Rscript {0}

      - name: Install 'future.tests'
        run: |
          remotes::install_cran("future.tests")
          remotes::install_github("futureverse/future.tests", ref="develop")
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Check future backend '${{ matrix.future.plan }}'
        run: |
          future.tests::check(plan = "${{ matrix.future.plan }}")
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ matrix.future.plan }}-results
          path: check
